name: Reproducibility checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest -q
      - name: Audit all archived full-study rows
        run: python verify_preprint.py
      - name: Exercise every declared condition
        run: python reproduce_preprint.py --workers 2 --runs 2 --periods 18 --output smoke-output
      - name: Rebuild summaries and figures from smoke output
        run: python analyze_preprint.py --input smoke-output
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-output
          path: smoke-output
