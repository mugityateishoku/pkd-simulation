[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pkd-simulation"
version = "3.4.0"
description = "Accuracy and influence in councils selected by track record and lottery"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "matplotlib>=3.9,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
